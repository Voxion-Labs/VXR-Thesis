name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# CI runs with strictly read-only permissions for safety against fork PRs
permissions:
  contents: read

jobs:
  test-go:
    name: Go Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Go Vet
        run: go vet ./...

      - name: Go Build Server
        run: go build -v ./cmd/vxr-server

      - name: Go Test
        run: go test -v ./...

  test-python:
    name: Python Lint & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f benchmarks/requirements.txt ]; then pip install -r benchmarks/requirements.txt; fi

      - name: Syntax & Bytecode Compilation
        run: |
          python -m py_compile benchmarks/scripts/*.py
          python -m py_compile scripts/*.py

  build-cpp:
    name: C++ CMake Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure CMake
        run: cmake -B build -S core-cpp

      - name: Build C++ Targets
        run: cmake --build build

      - name: Execute Native Systems Verification Suite
        run: ./build/test_kernel

  verify-manifest-tooling:
    name: Verify Commit Manifest Tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Manifest Generation
        run: python scripts/generate_manifest.py --commit-sha HEAD

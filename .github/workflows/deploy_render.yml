name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Service to Render
    runs-on: ubuntu-latest
    if: >-
      (github.repository_owner == github.actor ||
       github.actor == 'liambrooks-lab' ||
       github.actor == 'R-Jena') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Trigger Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not configured. Skipping deploy trigger."
          else
            echo "Triggering Render deployment..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Deploy hook sent successfully."
          fi

name: Commit Manifest Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: commit-manifest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record-manifest:
    name: Record Commit Manifest
    runs-on: ubuntu-latest
    # Security Policy: Only the repo owner, authorized maintainers, or the bot can write.
    # Forks and untrusted actors cannot run write operations on main.
    if: >-
      (github.repository_owner == github.actor ||
       github.actor == 'liambrooks-lab' ||
       github.actor == 'R-Jena' ||
       github.actor == 'github-actions[bot]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'chore(manifest)')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Commit JSON Data and Manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python scripts/generate_manifest.py --commit-sha "${{ github.sha }}"

      - name: Commit and Push Manifest to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/
          if git diff --staged --quiet; then
            echo "Commit manifest is already up to date."
          else
            git commit -m "chore(manifest): record commit ${{ github.sha }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

version: '3.8'

services:
  vxr-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vxr-thesis-node
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./benchmarks/data:/app/benchmarks/data
    environment:
      - GOMAXPROCS=2
      - GOMEMLIMIT=450MiB
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

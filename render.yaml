# ==============================================================================
# Voxion Labs: Render Infrastructure-as-Code Blueprint
# Target: Render Free Web Service (512MB RAM, 0.1 CPU)
# ==============================================================================
services:
  - type: web
    name: vxr-thesis
    runtime: go
    plan: free
    region: oregon
    branch: main
    buildCommand: go build -v -ldflags="-s -w" -o vxr-server ./cmd/vxr-server
    startCommand: ./vxr-server -serve
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: RENDER
        value: "true"
